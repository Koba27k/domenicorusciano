name: Pubblica sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # og:image needs an absolute URL: use the Pages address (the custom domain once it is set).
      - name: Inserisci indirizzo del sito
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: sed -i "s#%SITE_URL%#${SITE_URL}#g" dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
